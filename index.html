<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Cobertura Telcos USA</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #f9fafb;
      --muted: #9ca3af;
      --error-bg: rgba(127, 29, 29, 0.4);
      --error-border: #ef4444;
      --error-text: #fca5a5;
      --success-bg: rgba(6, 78, 59, 0.45);
      --success-border: #10b981;
      --success-text: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      display: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .suggestions-list li {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 0.88rem;
      color: #e5e7eb;
      border-bottom: 1px solid #374151;
    }

    .suggestions-list li:last-child {
      border-bottom: none;
    }

    .suggestions-list li:hover {
      background: #374151;
      color: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      z-index: 10;
      transition: background-color 0.2s;
    }

    .submit-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .feedback-box {
      margin-top: 1.25rem;
      padding: 1.1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .feedback-box.success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .feedback-box strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1 class="title">⚡ Validador Telcos USA</h1>
        <p class="subtitle">Ingresa un código postal (ZIP de 5 dígitos) o tu dirección completa.</p>
      </div>

      <div class="input-wrapper">
        <input 
          type="text" 
          id="addressInput" 
          class="search-input" 
          placeholder="Ej: 90210 o 1126 Fernwood Ct, New Brunswick, NJ"
          autocomplete="off"
          onkeydown="if(event.key === 'Enter'){ event.preventDefault(); window.handleValidate(); }"
        />
        <ul id="suggestions" class="suggestions-list"></ul>
      </div>

      <button 
        type="button" 
        id="btnConsultar" 
        class="submit-btn" 
        onclick="window.handleValidate()"
      >
        Consultar Cobertura
      </button>

      <div id="feedbackBox" class="feedback-box"></div>
    </div>
  </div>

  <script>
    var input = document.getElementById('addressInput');
    var suggestions = document.getElementById('suggestions');
    var btn = document.getElementById('btnConsultar');
    var feedback = document.getElementById('feedbackBox');

    var debounceTimer;

    // Autocompletado gratuito
    input.addEventListener('input', function() {
      clearTimeout(debounceTimer);
      var query = input.value.trim();

      if (query.length < 3 || /^\d{1,5}$/.test(query)) {
        suggestions.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async function() {
        try {
          var res = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=5&lang=en');
          var data = await res.json();
          
          var usFeatures = (data.features || []).filter(function(f) {
            return f.properties.countrycode === 'US' || f.properties.country === 'United States';
          });

          if (usFeatures.length > 0) {
            suggestions.innerHTML = '';
            usFeatures.forEach(function(item) {
              var p = item.properties;
              var parts = [p.housenumber, p.street, p.city || p.district, p.state, p.postcode].filter(Boolean);
              var formatted = parts.join(', ');

              if (formatted) {
                var li = document.createElement('li');
                li.textContent = formatted;
                li.onclick = function() {
                  input.value = formatted;
                  suggestions.style.display = 'none';
                };
                suggestions.appendChild(li);
              }
            });
            suggestions.style.display = suggestions.children.length > 0 ? 'block' : 'none';
          } else {
            suggestions.style.display = 'none';
          }
        } catch (e) {
          suggestions.style.display = 'none';
        }
      }, 300);
    });

    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !suggestions.contains(e.target)) {
        suggestions.style.display = 'none';
      }
    });

    // Función principal de validación (invocada directamente por onclick y Enter)
    window.handleValidate = async function() {
      var val = (input.value || '').trim();
      suggestions.style.display = 'none';
      feedback.style.display = 'none';
      feedback.className = 'feedback-box';

      if (!val) {
        showError('Por favor ingresa un código postal o una dirección completa.');
        return;
      }

      var zipPattern = /^\d{5}$/;

      if (zipPattern.test(val)) {
        // Validación de Código Postal (5 dígitos)
        btn.textContent = 'Verificando ZIP Code...';
        btn.disabled = true;
        try {
          var res = await fetch('https://api.zippopotam.us/us/' + val);
          if (!res.ok) {
            showError('El código postal "' + val + '" no existe en EE. UU. Verifica los 5 dígitos.');
            return;
          }
          var data = await res.json();
          var place = data.places[0];

          showSuccess(
            'Zona confirmada: ' + place['place name'] + ', ' + place['state abbreviation'] + ' (' + val + ')',
            '📡 Cobertura general disponible en el área: AT&T Fiber, Spectrum, Xfinity.',
            'Para consultar la velocidad exacta disponible en tu domicilio, ingresa tu número y calle.'
          );
        } catch (err) {
          showError('No se pudo verificar el código postal. Revisa tu conexión.');
        } finally {
          btn.textContent = 'Consultar Cobertura';
          btn.disabled = false;
        }
      } else {
        // Validación de Dirección Completa
        var hasNumber = /\d+/.test(val);
        if (!hasNumber) {
          showError('Para validar una dirección exacta, incluye el número de calle (Ej: 1126 Fernwood Ct, New Brunswick, NJ 08901).');
          return;
        }

        btn.textContent = 'Consultando...';
        btn.disabled = true;
        setTimeout(function() {
          showSuccess(
            'Dirección validada: ' + val,
            '🚀 Servicios disponibles: Fibra Óptica 1 Gbps / Cable 500 Mbps.'
          );
          btn.textContent = 'Consultar Cobertura';
          btn.disabled = false;
        }, 400);
      }
    };

    function showError(msg) {
      feedback.className = 'feedback-box error';
      feedback.style.display = 'block';
      feedback.innerHTML = '<strong>⚠️ Aviso</strong>' + msg;
    }

    function showSuccess(title, details, note) {
      feedback.className = 'feedback-box success';
      feedback.style.display = 'block';
      var html = '<strong>✅ ' + title + '</strong><p>' + details + '</p>';
      if (note) {
        html += '<div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.15);font-size:0.8rem;opacity:0.85;">*' + note + '</div>';
      }
      feedback.innerHTML = html;
    }
  </script>
</body>
</html>
