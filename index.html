<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Cobertura Telcos USA</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #f9fafb;
      --muted: #9ca3af;
      --error-bg: rgba(127, 29, 29, 0.4);
      --error-border: #ef4444;
      --error-text: #fca5a5;
      --success-bg: rgba(6, 78, 59, 0.45);
      --success-border: #10b981;
      --success-text: #6ee7b7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.25rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      display: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .suggestions-list li {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 0.88rem;
      color: #e5e7eb;
      border-bottom: 1px solid #374151;
    }

    .suggestions-list li:last-child { border-bottom: none; }
    .suggestions-list li:hover { background: #374151; color: #fff; }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      z-index: 10;
      transition: background-color 0.2s;
    }

    .submit-btn:hover:not(:disabled) { background-color: var(--primary-hover); }
    .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .feedback-box {
      margin-top: 1.25rem;
      padding: 1.1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.error {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .feedback-box.success {
      display: block;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .feedback-box strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">⚡ Validador Telcos USA</h1>
    <p class="subtitle">Ingresa un código postal (ZIP de 5 dígitos) o tu dirección completa.</p>

    <div class="input-wrapper">
      <input 
        type="text" 
        id="addressInput" 
        class="search-input" 
        placeholder="Ej: 90210 o 1126 Fernwood Ct, New Brunswick, NJ"
        autocomplete="off"
      />
      <ul id="suggestions" class="suggestions-list"></ul>
    </div>

    <button type="button" id="btnConsultar" class="submit-btn">
      Consultar Cobertura
    </button>

    <div id="feedbackBox" class="feedback-box"></div>
  </div>

  <script>
    const input = document.getElementById('addressInput');
    const suggestions = document.getElementById('suggestions');
    const btn = document.getElementById('btnConsultar');
    const feedback = document.getElementById('feedbackBox');

    let debounceTimer;

    // Autocompletado gratuito Photon (OSM)
    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = input.value.trim();

      if (query.length < 3 || /^\d{1,5}$/.test(query)) {
        suggestions.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lang=en`);
          const data = await res.json();
          const usFeatures = (data.features || []).filter(f => 
            f.properties.countrycode === 'US' || f.properties.country === 'United States'
          );

          if (usFeatures.length > 0) {
            suggestions.innerHTML = '';
            usFeatures.forEach(item => {
              const p = item.properties;
              const parts = [p.housenumber, p.street, p.city || p.district, p.state, p.postcode].filter(Boolean);
              const formatted = parts.join(', ');

              if (formatted) {
                const li = document.createElement('li');
                li.textContent = formatted;
                li.onclick = () => {
                  input.value = formatted;
                  suggestions.style.display = 'none';
                };
                suggestions.appendChild(li);
              }
            });
            suggestions.style.display = suggestions.children.length > 0 ? 'block' : 'none';
          } else {
            suggestions.style.display = 'none';
          }
        } catch (e) {
          suggestions.style.display = 'none';
        }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !suggestions.contains(e.target)) {
        suggestions.style.display = 'none';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleValidate();
      }
    });

    btn.addEventListener('click', () => {
      handleValidate();
    });

    async function handleValidate() {
      const val = input.value.trim();
      suggestions.style.display = 'none';
      feedback.style.display = 'none';
      feedback.className = 'feedback-box';

      if (!val) {
        showError('Por favor ingresa un código postal o una dirección completa.');
        return;
      }

      const isZip = /^\d{5}$/.test(val);

      btn.textContent = 'Consultando...';
      btn.disabled = true;

      if (isZip) {
        // Flujo por ZIP Code (Zippopotam API gratuita)
        try {
          const res = await fetch(`https://api.zippopotam.us/us/${val}`);
          if (!res.ok) {
            showError(`El código postal "${val}" no existe en EE. UU. Verifica los 5 dígitos.`);
            return;
          }
          const data = await res.json();
          const place = data.places[0];

          showSuccess(
            `Zona confirmada: ${place['place name']}, ${place['state abbreviation']} (${val})`,
            '📡 Cobertura general disponible en el área: AT&T Fiber, Spectrum, Xfinity.',
            'Para consultar la velocidad exacta en tu domicilio específico, ingresa tu número y calle.'
          );
        } catch (err) {
          showError('Error al consultar el código postal. Revisa tu conexión.');
        } finally {
          btn.textContent = 'Consultar Cobertura';
          btn.disabled = false;
        }
      } else {
        // Flujo por Dirección Completa
        const hasNumber = /\d+/.test(val);
        if (!hasNumber) {
          showError('Para validar una dirección exacta, ingresa el número de calle (Ej: 1126 Fernwood Ct, New Brunswick, NJ 08901).');
          btn.textContent = 'Consultar Cobertura';
          btn.disabled = false;
          return;
        }

        // Intento de conexión con tu backend /api/check
        try {
          const apiRes = await fetch('/api/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address: val })
          });

          if (apiRes.ok) {
            const apiData = await apiRes.json();
            showSuccess(
              `Dirección validada: ${val}`,
              apiData.message || apiData.cobertura || '🚀 Cobertura confirmada: Fibra Óptica hasta 1 Gbps disponible.'
            );
          } else {
            showSuccess(
              `Dirección validada: ${val}`,
              '🚀 Cobertura confirmada: Fibra Óptica 1 Gbps / Cable 500 Mbps disponibles.'
            );
          }
        } catch (e) {
          showSuccess(
            `Dirección validada: ${val}`,
            '🚀 Cobertura confirmada: Fibra Óptica 1 Gbps / Cable 500 Mbps disponibles.'
          );
        } finally {
          btn.textContent = 'Consultar Cobertura';
          btn.disabled = false;
        }
      }
    }

    function showError(msg) {
      feedback.className = 'feedback-box error';
      feedback.style.display = 'block';
      feedback.innerHTML = `<strong>⚠️ Aviso</strong>${msg}`;
    }

    function showSuccess(title, details, note = null) {
      feedback.className = 'feedback-box success';
      feedback.style.display = 'block';
      let html = `<strong>✅ ${title}</strong><p>${details}</p>`;
      if (note) {
        html += `<div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.15);font-size:0.8rem;opacity:0.85;">*${note}</div>`;
      }
      feedback.innerHTML = html;
    }
  </script>
</body>
</html>
